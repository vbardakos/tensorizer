[project]
name = "tensorizer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint.per-file-ignores]
"src/tensorizer/frame.py" = ["PLR0913", "PLR0917"]
"src/tensorizer/tensor.py" = ["PLR0904"]
"src/tests/**" = ["PLR6301", "S101", "PLR2004"]

[tool.uv.workspace]
members = [
    "ext/simd",
]

[dependency-groups]
tests = [
    "pytest>=9.0.2",
]
