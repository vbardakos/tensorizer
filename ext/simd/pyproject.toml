[project]
name = "simd"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vasileios Bardakos", email = "vasilisbardakos@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
simd = "simd:main"

[tool.maturin]
module-name = "simd._core"
python-packages = ["simd"]
python-source = "src"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.rs" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[dependency-groups]
dev = [
    "maturin>=1.12.6",
]
